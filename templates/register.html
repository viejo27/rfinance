<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Registro — RFinance</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="/css/style.css" rel="stylesheet">
	</head>
	<body>
		<main class="auth-center">
			<div class="auth-box">
				<h1 class="auth-brand">RFINANCE</h1>
				<p class="auth-sub mini-label">CREAR CUENTA</p>
				<p class="notice" id="registerMsg" role="status" hidden></p>
				<form id="registerForm">
					<label class="field-label mini-label" for="name">NOMBRE</label>
					<input class="field" type="text" id="name" name="name" autocomplete="given-name" required>

					<label class="field-label mini-label" for="last_name">APELLIDO</label>
					<input class="field" type="text" id="last_name" name="last_name" autocomplete="family-name" required>

					<label class="field-label mini-label" for="email">EMAIL</label>
					<input class="field" type="email" id="email" name="email" autocomplete="email" required>

					<label class="field-label mini-label" for="password">CONTRASEÑA</label>
					<input class="field" type="password" id="password" name="password" autocomplete="new-password" required>

					<button class="btn btn-primary" type="submit" style="margin-top:26px">REGISTRARSE</button>
				</form>
				<p class="auth-link">¿Ya tienes cuenta? <a href="/login">INICIA SESIÓN</a></p>
				<footer class="auth-footer mini-label">
					<span>UN LIBRO, <b style="color:var(--rojo)">DOS MONEDAS</b>, CERO INTERMEDIARIOS</span>
				</footer>
			</div>
		</main>
		<script src="/js/register.js"></script>
	</body>
</html>
