<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Registro — RFinance</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="/css/style.css" rel="stylesheet">
	</head>
	<body>
		<main class="auth-centro">
			<div class="auth-caja">
				<h1 class="auth-marca">RFINANCE</h1>
				<p class="auth-sub rotulo">CREAR CUENTA</p>
				<p class="aviso" id="registerMsg" role="status" hidden></p>
				<form id="registerForm">
					<label class="campo-label rotulo" for="name">NOMBRE</label>
					<input class="campo" type="text" id="name" name="name" autocomplete="given-name" required>

					<label class="campo-label rotulo" for="last_name">APELLIDO</label>
					<input class="campo" type="text" id="last_name" name="last_name" autocomplete="family-name" required>

					<label class="campo-label rotulo" for="email">EMAIL</label>
					<input class="campo" type="email" id="email" name="email" autocomplete="email" required>

					<label class="campo-label rotulo" for="password">CONTRASEÑA</label>
					<input class="campo" type="password" id="password" name="password" autocomplete="new-password" required>

					<button class="btn btn-primario" type="submit" style="margin-top:26px">REGISTRARSE</button>
				</form>
				<p class="auth-enlace">¿Ya tienes cuenta? <a href="/login">INICIA SESIÓN</a></p>
				<footer class="auth-pie rotulo">
					<span>UN LIBRO, <b style="color:var(--rojo)">DOS MONEDAS</b>, CERO INTERMEDIARIOS</span>
				</footer>
			</div>
		</main>
		<script src="/js/register.js"></script>
	</body>
</html>
