<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Ingreso — RFinance</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="/css/style.css" rel="stylesheet">
		<link rel="icon" type="image/x-icon" href="/favicon.ico">
	</head>
	<body>
		<main class="auth-center">
			<div class="auth-box">
				<h1 class="auth-brand">RFINANCE</h1>
				<p class="auth-sub mini-label">INICIO DE SESIÓN</p>
				<p class="notice notice-danger" id="loginError" role="alert" hidden></p>
				<form id="loginForm">
					<label class="field-label mini-label" for="email">EMAIL</label>
					<input class="field" type="email" id="email" name="email" autocomplete="email" required>

					<label class="field-label mini-label" for="password">CONTRASEÑA</label>
					<input class="field" type="password" id="password" name="password" autocomplete="current-password" required>

					<button class="btn btn-primary auth-submit" type="submit">INGRESAR</button>
				</form>
				<p class="auth-link">¿No tienes cuenta? <a href="/register">REGÍSTRATE</a></p>
				<footer class="auth-footer mini-label">
					<span>MONEDAS: <b class="auth-rojo">ARS · USD</b> · TUS DATOS, TU LIBRO</span>
				</footer>
			</div>
		</main>
		<script src="/js/login.js"></script>
	</body>
</html>
