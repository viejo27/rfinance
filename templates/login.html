<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Ingreso — RFinance</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="/css/style.css" rel="stylesheet">
	</head>
	<body>
		<main class="auth-centro">
			<div class="auth-caja">
				<h1 class="auth-marca">RFINANCE</h1>
				<p class="auth-sub rotulo">INICIO DE SESIÓN</p>
				<p class="aviso aviso-error" id="loginError" role="alert" hidden></p>
				<form id="loginForm">
					<label class="campo-label rotulo" for="email">EMAIL</label>
					<input class="campo" type="email" id="email" name="email" autocomplete="email" required>

					<label class="campo-label rotulo" for="password">CONTRASEÑA</label>
					<input class="campo" type="password" id="password" name="password" autocomplete="current-password" required>

					<button class="btn btn-primario" type="submit" style="margin-top:26px">INGRESAR</button>
				</form>
				<p class="auth-enlace">¿No tienes cuenta? <a href="/register">REGÍSTRATE</a></p>
				<footer class="auth-pie rotulo">
					<span>MONEDAS: <b style="color:var(--rojo)">ARS · USD</b> · TUS DATOS, TU LIBRO</span>
				</footer>
			</div>
		</main>
		<script src="/js/login.js"></script>
	</body>
</html>
