<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Nueva contraseña — RFinance</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="/css/style.css" rel="stylesheet">
		<link rel="icon" type="image/x-icon" href="/favicon.ico">
	</head>
	<body>
		<main class="auth-center">
			<div class="auth-box">
				<h1 class="auth-brand">RFINANCE</h1>
				<p class="auth-sub mini-label">NUEVA CONTRASEÑA</p>
				<p class="notice" id="resetMsg" role="status" hidden></p>
				{% if valid %}
				<form id="resetForm" data-token="{{ token }}">
					<label class="field-label mini-label" for="password">CONTRASEÑA</label>
					<input class="field" type="password" id="password" name="password" autocomplete="new-password" minlength="10" maxlength="72" required>

					<label class="field-label mini-label" for="passwordConfirm">REPETIR CONTRASEÑA</label>
					<input class="field" type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password" minlength="10" maxlength="72" required>

					<button class="btn btn-primary auth-submit" type="submit">CAMBIAR CONTRASEÑA</button>
				</form>
				{% else %}
				<p class="notice notice-danger">El enlace no es válido o venció.</p>
				<p class="auth-link"><a href="/forgot-password">PEDIR UN ENLACE NUEVO</a></p>
				{% endif %}
				<footer class="auth-footer mini-label">
					<span>AL CAMBIARLA, SE <b class="auth-rojo">CIERRAN LAS DEMÁS SESIONES</b></span>
				</footer>
			</div>
		</main>
		<script src="/js/reset-password.js"></script>
	</body>
</html>
