<!DOCTYPE html>
<html lang="es">
	<head>
		<title>Recuperar contraseña — RFinance</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="/css/style.css" rel="stylesheet">
		<link rel="icon" type="image/x-icon" href="/favicon.ico">
	</head>
	<body>
		<main class="auth-center">
			<div class="auth-box">
				<h1 class="auth-brand">RFINANCE</h1>
				<p class="auth-sub mini-label">RECUPERAR CONTRASEÑA</p>
				<p class="notice" id="forgotMsg" role="status" hidden></p>
				<form id="forgotForm">
					<label class="field-label mini-label" for="email">EMAIL</label>
					<input class="field" type="email" id="email" name="email" autocomplete="email" required>

					<button class="btn btn-primary auth-submit" type="submit">ENVIAR ENLACE</button>
				</form>
				<p class="auth-link"><a href="/login">VOLVER AL INGRESO</a></p>
				<footer class="auth-footer mini-label">
					<span>TE ENVIAMOS UN ENLACE VÁLIDO POR <b class="auth-rojo">60 MINUTOS</b></span>
				</footer>
			</div>
		</main>
		<script src="/js/forgot-password.js"></script>
	</body>
</html>
