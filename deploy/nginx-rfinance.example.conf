# Ejemplo de configuración nginx para rfinance_app.
#
# TLS lo termina nginx; la app escucha en 127.0.0.1:8080 en HTTP plano
# (nunca exponer el 8080 de la app directo a Internet).
#
# Las dos capas de rate limiting defendidas en el threat model:
#   1. In-app con actix-governor (src/main.rs): 5 logins y 3 registros
#      por minuto por IP.
#   2. Acá, en el proxy, por si un ataque viaja ya agotado de CPU.
#
# X-Real-IP es la clave del limiter in-app (src/main.rs, RealIpKeyExtractor):
# nginx debe setearlo siempre para que el límite sea por usuario.
# La app ignora este header si no viene parseable como IP; confía en él solo
# porque es imposible que llegue algo si no es por este proxy (bind en loopback).

limit_req_zone $binary_remote_addr zone=rfinance_login:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=rfinance_register:10m rate=3r/m;

upstream rfinance_app {
    server 127.0.0.1:8080;
    keepalive 8;
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name rfinance.example.com;

    # Certificados: ajustá a tu CA o certbot
    ssl_certificate     /etc/letsencrypt/live/rfinance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rfinance.example.com/privkey.pem;

    # Una vez confirmado que todo funciona por HTTPS, descomentar:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Los endpoints públicos más abusable: contención dura del proxy.
    # burst pequeño sin nodelay: la request rebalsada ESPERA en cola por
    # defecto; mejor devolver 429 ya (ver deploy/README de SECURITY.md).
    location = /api/login {
        limit_req zone=rfinance_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://rfinance_app;
        include /etc/nginx/rfinance_proxy_params.conf;
    }

    location = /api/register {
        limit_req zone=rfinance_register burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://rfinance_app;
        include /etc/nginx/rfinance_proxy_params.conf;
    }

    location / {
        proxy_pass http://rfinance_app;
        include /etc/nginx/rfinance_proxy_params.conf;
    }
}

# --- HTTP → HTTPS ---
server {
    listen 80;
    server_name rfinance.example.com;
    return 301 https://$host$request_uri;
}
