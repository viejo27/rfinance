[package]
name = "rfinance_app"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6"
actix-session = { version = "0.10", features = ["cookie-session"] }
actix-web = "4.12.1"
actix-web-grants = "4.1.2"
askama = "0.15.4"
bcrypt = "0.19.0"
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["runtime-async-std", "tls-rustls", "postgres", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-std = { version = "1", features = ["attributes"] }
