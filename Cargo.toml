[package]
name = "rfinance_app"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.7.4"
actix-governor = { version = "0.10.0", features = ["log"] }
actix-session = { version = "0.10", features = ["cookie-session"] }
actix-web = { version = "4.20.0", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
actix-web-grants = "4.1.2"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
bcrypt = "0.19.2"
dotenvy = "0.15.7"
env_logger = "0.11.11"
getrandom = "0.3"
hex = "0.4"
lettre = { version = "0.11.24", default-features = false, features = [
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
] }
sha2 = "0.10"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid"] }
tokio = { version = "1", features = ["rt", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
